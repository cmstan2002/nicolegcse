<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0E0D0B">
<title>J277 Networking · Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..900,0..100;1,9..144,300..900,0..100&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --ink: #0E0D0B;
    --card: #1A1815;
    --card-elev: #211E1A;
    --border: #2D2924;
    --border-soft: #1F1C18;
    --text: #ECE6D7;
    --text-dim: #968F80;
    --text-faint: #5A5448;
    --accent: #D4A056;
    --accent-bright: #E8B96A;
    --accent-dim: rgba(212, 160, 86, 0.14);
    --serif: 'Fraunces', Georgia, serif;
    --sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --mono: 'JetBrains Mono', Menlo, monospace;
  }

  html, body {
    height: 100%;
    overscroll-behavior: none;
  }

  body {
    background: var(--ink);
    color: var(--text);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    background-image:
      radial-gradient(ellipse at 20% 0%, rgba(212, 160, 86, 0.07), transparent 55%),
      radial-gradient(ellipse at 85% 100%, rgba(212, 160, 86, 0.04), transparent 50%);
    background-attachment: fixed;
  }

  .app {
    max-width: 640px;
    margin: 0 auto;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding:
      max(16px, env(safe-area-inset-top))
      16px
      max(16px, env(safe-area-inset-bottom));
  }

  /* ─── Header ─── */
  .header {
    padding: 6px 4px 22px;
    border-bottom: 1px solid var(--border-soft);
  }

  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 18px;
  }

  .header-text { flex: 1; min-width: 0; }

  .eyebrow {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
    font-weight: 500;
  }

  .title {
    font-family: var(--serif);
    font-variation-settings: "opsz" 144, "SOFT" 50;
    font-weight: 500;
    font-size: 30px;
    line-height: 1;
    letter-spacing: -0.018em;
    color: var(--text);
  }

  .title em {
    font-style: italic;
    font-variation-settings: "opsz" 144, "SOFT" 100;
    font-weight: 400;
    color: var(--accent);
  }

  .subtitle {
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 8px;
    letter-spacing: 0.005em;
  }

  .top-actions { display: flex; gap: 8px; flex-shrink: 0; }

  .icon-btn {
    width: 40px;
    height: 40px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.18s ease;
  }
  .icon-btn:active {
    transform: scale(0.92);
    background: var(--accent-dim);
    color: var(--accent);
    border-color: var(--accent);
  }

  .progress-wrap {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .progress-bar {
    flex: 1;
    height: 2px;
    background: var(--border);
    border-radius: 1px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-bright));
    transition: width 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
    width: 0;
  }

  .progress-label {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--text-dim);
    min-width: 54px;
    text-align: right;
    letter-spacing: 0.02em;
  }

  /* ─── Card area ─── */
  .card-area {
    flex: 1;
    display: flex;
    align-items: stretch;
    justify-content: center;
    padding: 18px 0;
    perspective: 1800px;
    min-height: 0;
  }

  .card {
    width: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.65s cubic-bezier(0.4, 0.15, 0.2, 1);
    cursor: pointer;
  }

  .card.flipped { transform: rotateY(180deg); }

  .face {
    position: absolute;
    inset: 0;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 26px 24px;
    display: flex;
    flex-direction: column;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.04) inset,
      0 30px 60px -20px rgba(0,0,0,0.5),
      0 8px 24px -8px rgba(0,0,0,0.3);
  }

  .face::-webkit-scrollbar { width: 0; display: none; }

  .face.back {
    transform: rotateY(180deg);
    background: var(--card-elev);
  }

  /* Decorative corner mark on front */
  .face.front::after {
    content: '';
    position: absolute;
    top: 14px;
    right: 14px;
    width: 24px;
    height: 24px;
    border-top: 1px solid var(--border);
    border-right: 1px solid var(--border);
    border-top-right-radius: 12px;
    pointer-events: none;
  }
  .face.back::before {
    content: '';
    position: absolute;
    bottom: 14px;
    left: 14px;
    width: 24px;
    height: 24px;
    border-bottom: 1px solid var(--border);
    border-left: 1px solid var(--border);
    border-bottom-left-radius: 12px;
    pointer-events: none;
  }

  /* Card meta */
  .meta {
    display: flex;
    gap: 8px;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }

  .chip {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 5px 9px;
    border-radius: 4px;
    background: var(--accent-dim);
    color: var(--accent);
    font-weight: 500;
  }

  .chip.spec {
    background: rgba(255,255,255,0.04);
    color: var(--text-dim);
  }

  /* Front content */
  .question {
    font-family: var(--serif);
    font-variation-settings: "opsz" 60, "SOFT" 30;
    font-weight: 400;
    font-size: 21px;
    line-height: 1.32;
    letter-spacing: -0.005em;
    color: var(--text);
    flex: 1;
    display: flex;
    align-items: center;
    padding: 8px 0;
  }

  .question code {
    font-family: var(--mono);
    font-size: 0.82em;
    background: rgba(212, 160, 86, 0.1);
    padding: 1px 6px;
    border-radius: 4px;
    color: var(--accent);
  }

  .question strong {
    font-weight: 600;
    color: var(--accent);
  }

  .question .blank {
    display: inline-block;
    min-width: 70px;
    border-bottom: 2px solid var(--accent);
    padding: 0 6px;
    color: transparent;
    margin: 0 2px;
    line-height: 1;
  }

  /* Back content */
  .answer {
    font-size: 14.5px;
    line-height: 1.55;
    color: var(--text);
    flex: 1;
  }

  .answer p { margin-bottom: 11px; }
  .answer p:last-child { margin-bottom: 0; }

  .answer strong {
    color: var(--accent);
    font-weight: 600;
  }

  .answer em {
    font-style: italic;
    color: var(--text-dim);
  }

  .answer ul, .answer ol {
    margin: 6px 0 12px 20px;
  }

  .answer li {
    margin-bottom: 5px;
  }

  .answer code {
    font-family: var(--mono);
    font-size: 12.5px;
    background: rgba(255,255,255,0.05);
    padding: 1px 5px;
    border-radius: 3px;
    color: var(--accent);
    word-break: break-word;
  }

  .answer h4 {
    font-family: var(--serif);
    font-variation-settings: "opsz" 30;
    font-weight: 600;
    font-style: italic;
    font-size: 14px;
    margin: 14px 0 5px;
    color: var(--accent);
    letter-spacing: 0.005em;
  }

  .answer h4:first-child { margin-top: 0; }

  /* Tap hint */
  .hint {
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px dashed var(--border);
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-faint);
    text-align: center;
  }

  /* ─── Controls ─── */
  .controls {
    padding: 18px 4px 4px;
    display: flex;
    gap: 10px;
    align-items: center;
    border-top: 1px solid var(--border-soft);
  }

  .btn {
    flex: 1;
    height: 52px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 13px;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.005em;
    cursor: pointer;
    transition: all 0.18s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn:active {
    transform: scale(0.97);
    background: var(--border);
  }

  .btn:disabled {
    opacity: 0.32;
    cursor: not-allowed;
  }

  .btn:disabled:active { transform: none; background: transparent; }

  .btn.primary {
    background: var(--accent);
    color: var(--ink);
    border-color: var(--accent);
    flex: 1.5;
  }

  .btn.primary:active {
    background: #BC8F4A;
  }

  .btn .arrow {
    font-family: var(--serif);
    font-size: 17px;
    font-weight: 400;
  }

  /* ─── Done state ─── */
  .done {
    display: none;
    text-align: center;
    padding: 40px 20px;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
  }

  .done.visible { display: flex; }

  .done-eyebrow {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 16px;
  }

  .done-title {
    font-family: var(--serif);
    font-variation-settings: "opsz" 144, "SOFT" 100;
    font-style: italic;
    font-weight: 400;
    font-size: 42px;
    line-height: 1.05;
    margin-bottom: 16px;
    letter-spacing: -0.01em;
  }

  .done-text {
    color: var(--text-dim);
    font-size: 15px;
    line-height: 1.5;
    margin-bottom: 28px;
    max-width: 340px;
  }

  .done .btn {
    flex: none;
    padding: 0 32px;
    max-width: 240px;
  }

  /* ─── Entrance ─── */
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .header { animation: rise 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
  .card-area { animation: rise 0.5s 0.08s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
  .controls { animation: rise 0.5s 0.16s cubic-bezier(0.2, 0.8, 0.2, 1) both; }

  /* Tighter on small phones */
  @media (max-height: 700px) {
    .question { font-size: 19px; }
    .title { font-size: 26px; }
    .face { padding: 22px 20px; }
    .meta { margin-bottom: 16px; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="header-row">
      <div class="header-text">
        <div class="eyebrow">OCR J277 · 1.3 + 1.4</div>
        <h1 class="title">Networking <em>&amp;</em> Security</h1>
        <div class="subtitle">25 cards · master, not memorise</div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="shuffle" aria-label="Shuffle">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
        </button>
        <button class="icon-btn" id="restart" aria-label="Restart">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
        </button>
      </div>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
      <div class="progress-label" id="counter">1 / 25</div>
    </div>
  </header>

  <div class="card-area" id="cardArea">
    <div class="card" id="card">
      <div class="face front">
        <div class="meta">
          <span class="chip" id="typeChip">REASONING</span>
          <span class="chip spec" id="specChip">1.3.1</span>
        </div>
        <div class="question" id="questionText"></div>
        <div class="hint">Tap to reveal</div>
      </div>
      <div class="face back">
        <div class="meta">
          <span class="chip" id="typeChipBack">REASONING</span>
          <span class="chip spec" id="specChipBack">1.3.1</span>
        </div>
        <div class="answer" id="answerText"></div>
        <div class="hint">Tap to flip back</div>
      </div>
    </div>
    <div class="done" id="done">
      <div class="done-eyebrow">Deck complete</div>
      <h2 class="done-title">25 down.</h2>
      <p class="done-text">Spaced repetition only works if you come back tomorrow. Same time, same place.</p>
      <button class="btn primary" id="restartFromDone">Start again</button>
    </div>
  </div>

  <div class="controls">
    <button class="btn" id="prev"><span class="arrow">←</span> Prev</button>
    <button class="btn primary" id="flip">Flip card</button>
    <button class="btn" id="next">Next <span class="arrow">→</span></button>
  </div>
</div>

<script>
const cards = [
  {
    type: "Reasoning",
    spec: "1.3.1",
    front: `Why does adding more devices to a Wi-Fi network slow everyone down, even when nobody's downloading anything?`,
    back: `<p>Wireless bandwidth is <strong>shared</strong> across all devices on an access point — not dedicated per device.</p>
<p>Every device sends background traffic (system updates, syncs, presence beacons), and the WAP can only transmit to one device at a time on a given channel (CSMA/CA). More devices = smaller time-slice each.</p>
<p>Add interference, plus weaker signals from distant devices forcing slower data rates, and total throughput drops. <em>More devices = more contention = less for everyone.</em></p>`
  },
  {
    type: "Scenario",
    spec: "1.3.1",
    front: `A small office has a star topology with 12 PCs connected to one switch. The switch fails. What happens — and what would have happened with a mesh topology instead?`,
    back: `<h4>Star</h4>
<p>Every PC loses network access. The switch is a <strong>single point of failure</strong> — kill the centre, lose the network.</p>
<h4>Mesh</h4>
<p>Each device has multiple paths to others; loss of one node only affects connections through it. The rest of the network keeps working.</p>
<h4>Trade-off</h4>
<p>Mesh is more resilient but expensive — far more cabling and links. Star is cheap and easy to manage but fragile. Most offices accept the fragility for the cost saving and add a backup switch.</p>`
  },
  {
    type: "Compare",
    spec: "1.3.1",
    front: `Client–server vs peer-to-peer: when would a school choose each, and why?`,
    back: `<h4>School → client–server</h4>
<p>Centralised account management, file storage, and security policies. Easier backups, scalable to thousands of users, IT can enforce updates and permissions from one place.</p>
<h4>Small home network → peer-to-peer</h4>
<p>No server cost, simple setup, each device shares its own files directly with others. Fine for 2–4 devices, falls apart with 200.</p>
<h4>Trade-off</h4>
<p>Management overhead and cost (client–server) vs simplicity and limits (P2P). Schools have admin staff and need control — they'll always pick client–server.</p>`
  },
  {
    type: "Connection",
    spec: "1.3.1 + 1.3.2",
    front: `Walk through what happens when Nicole types <code>bbc.co.uk</code> into her browser. Where do DNS and HTTP fit?`,
    back: `<p><strong>1.</strong> Browser checks its local DNS cache for <code>bbc.co.uk</code>. Miss.</p>
<p><strong>2.</strong> Asks the OS resolver, which queries DNS servers — root → <code>.uk</code> → <code>.co.uk</code> → BBC's authoritative nameserver. Returns an IP address.</p>
<p><strong>3.</strong> Browser opens a <strong>TCP</strong> connection to that IP on port 443.</p>
<p><strong>4.</strong> TLS handshake (for HTTPS), then sends an <strong>HTTP</strong> GET request.</p>
<p><strong>5.</strong> Server responds with HTML; browser fetches CSS/JS/images via more HTTP requests; renders page.</p>
<p><em>DNS resolves names to IPs. HTTP transfers content. They run sequentially, not simultaneously.</em></p>`
  },
  {
    type: "Trace",
    spec: "1.3.2",
    front: `Trace what happens to a packet from your laptop to a web server, going down the four TCP/IP layers on the way out.`,
    back: `<h4>Application</h4>
<p>HTTP request created (e.g. <code>GET /index.html</code>).</p>
<h4>Transport (TCP)</h4>
<p>Wraps the HTTP message, adds source + destination port (e.g. 443), sequence number, splits into segments if large.</p>
<h4>Internet (IP)</h4>
<p>Wraps each segment, adds source + destination <strong>IP address</strong>, decides routing.</p>
<h4>Link / Data</h4>
<p>Wraps as a frame, adds source + destination <strong>MAC address</strong>, transmits as electrical pulses (Ethernet) or radio waves (Wi-Fi).</p>
<p><em>At the server, layers unwrap in reverse — link strips MAC, IP strips routing, TCP reassembles segments, application reads the HTTP.</em></p>`
  },
  {
    type: "Misconception",
    spec: "1.3.2 + 1.4",
    front: `Many students say "HTTPS encrypts the website." What's actually being encrypted, and what isn't?`,
    back: `<h4>Encrypted</h4>
<p>The data <em>in transit</em> between browser and server — request bodies, response content, cookies, headers, form data. Encrypted with TLS using a session key agreed during the handshake.</p>
<h4>NOT encrypted</h4>
<ul>
<li>The destination IP address (visible to your ISP)</li>
<li>The domain name during DNS lookup (and via SNI)</li>
<li>Data once it's on the server — server can read everything</li>
<li>Data once it's on your device — malware can read everything</li>
</ul>
<p><em>The site itself isn't "encrypted" — the connection is. HTTPS protects against eavesdropping in the middle, nothing else.</em></p>`
  },
  {
    type: "Extended response · 8 marks",
    spec: "1.3.1",
    front: `Discuss the impact of cloud storage on individuals and businesses. <strong>(8 marks)</strong>`,
    back: `<h4>Mark-scheme structure (point → explain → impact)</h4>
<h4>Benefit · individuals</h4>
<p>Access from anywhere on any device → files sync across phone/laptop without manual transfer → reduces risk of losing data if a device fails or is stolen.</p>
<h4>Benefit · businesses</h4>
<p>Pay-as-you-grow scaling → no upfront server hardware cost → enables remote and hybrid working, lowers barrier for startups.</p>
<h4>Drawback · reliance on connectivity</h4>
<p>No internet = no access → outages disrupt work → critical files should also exist offline.</p>
<h4>Drawback · privacy &amp; jurisdiction</h4>
<p>Third party holds your data → subject to their security and local laws → potential GDPR exposure if data crosses borders.</p>
<h4>Conclusion</h4>
<p>Net positive for most users, but creates dependency and privacy trade-offs that organisations must actively manage. <em>AOs hit: AO1 knowledge, AO2 application, AO3 evaluation.</em></p>`
  },
  {
    type: "Reasoning",
    spec: "1.3.2",
    front: `Why does a wired Ethernet connection usually outperform Wi-Fi on the exact same internet plan?`,
    back: `<p>The <strong>last leg</strong> — between device and router — is the bottleneck.</p>
<h4>Wired Ethernet</h4>
<p>Dedicated cable per device, no shared medium, no radio interference. Cat 6 supports 1 Gbps+, low latency, no contention.</p>
<h4>Wi-Fi</h4>
<p>Shared medium across all devices on the AP. Subject to interference (microwaves, neighbour networks, walls). Uses CSMA/CA — devices wait their turn before transmitting. Signal strength varies with distance, dropping data rate.</p>
<p><em>Same ISP plan, same external internet — but the wireless leg can't keep up with what the cable side delivers.</em></p>`
  },
  {
    type: "Cloze",
    spec: "1.3.1 + 1.3.2",
    front: `A {{router}} forwards data between different networks using {{IP}} addresses, while a {{switch}} forwards data within a single network using {{MAC}} addresses.`,
    back: `<p>A <strong>router</strong> forwards data between different networks using <strong>IP</strong> addresses, while a <strong>switch</strong> forwards data within a single network using <strong>MAC</strong> addresses.</p>
<p><em>Mnemonic: routers route between networks (IP = where on the internet), switches switch within a network (MAC = which device on this LAN).</em></p>`
  },
  {
    type: "Scenario",
    spec: "1.4",
    front: `Nicole's grandparents are still using the Wi-Fi password they set up in 2010, on WEP encryption. Why is this a serious risk and what should they change?`,
    back: `<h4>Why it's risky</h4>
<p>WEP has been considered <strong>broken</strong> since the mid-2000s. Free tools can crack a WEP key in <em>minutes</em>, exposing all traffic on the network and giving attackers a foothold on the LAN.</p>
<h4>What to change</h4>
<ul>
<li>Upgrade encryption to <strong>WPA2</strong> at minimum, <strong>WPA3</strong> if the router supports it</li>
<li>Use a long passphrase (12+ characters)</li>
<li>Rename the SSID away from the default to reduce targeted attacks</li>
<li>Disable WPS (also exploitable)</li>
</ul>
<p><em>Encryption isn't just "on or off" — the algorithm matters. WEP off-the-shelf in 2010 isn't safe in 2026.</em></p>`
  },

let currentIndex = 0;
let order = cards.map((_, i) => i);

const $ = id => document.getElementById(id);
const cardEl = $('card');
const doneEl = $('done');

function renderCard() {
  if (currentIndex >= order.length) {
    cardEl.style.display = 'none';
    doneEl.classList.add('visible');
    $('flip').disabled = true;
    $('next').disabled = true;
    $('prev').disabled = false;
    $('counter').textContent = `${order.length} / ${order.length}`;
    $('progress').style.width = '100%';
    return;
  }

  cardEl.style.display = '';
  doneEl.classList.remove('visible');

  const card = cards[order[currentIndex]];
  cardEl.classList.remove('flipped');

  $('typeChip').textContent = card.type.toUpperCase();
  $('typeChipBack').textContent = card.type.toUpperCase();
  $('specChip').textContent = card.spec;
  $('specChipBack').textContent = card.spec;

  // Cloze blanks: {{word}} → styled blank
  const front = card.front.replace(/\{\{([^}]+)\}\}/g, '<span class="blank">$1</span>');
  $('questionText').innerHTML = front;
  $('answerText').innerHTML = card.back;

  $('counter').textContent = `${currentIndex + 1} / ${order.length}`;
  $('progress').style.width = `${((currentIndex + 1) / order.length) * 100}%`;

  $('prev').disabled = currentIndex === 0;
  $('flip').disabled = false;
  $('next').disabled = false;
  $('flip').textContent = 'Flip card';

  // Reset scroll position on faces
  document.querySelectorAll('.face').forEach(f => f.scrollTop = 0);
}

function flip() {
  cardEl.classList.toggle('flipped');
  $('flip').textContent = cardEl.classList.contains('flipped') ? 'Flip back' : 'Flip card';
}

function next() {
  if (currentIndex < order.length) {
    currentIndex++;
    renderCard();
  }
}

function prev() {
  if (currentIndex > 0) {
    currentIndex--;
    renderCard();
  }
}

function shuffle() {
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  currentIndex = 0;
  renderCard();
}

function restart() {
  order = cards.map((_, i) => i);
  currentIndex = 0;
  renderCard();
}

cardEl.addEventListener('click', flip);
$('flip').addEventListener('click', (e) => { e.stopPropagation(); flip(); });
$('next').addEventListener('click', next);
$('prev').addEventListener('click', prev);
$('shuffle').addEventListener('click', shuffle);
$('restart').addEventListener('click', restart);
$('restartFromDone').addEventListener('click', restart);

// Swipe gestures
let touchStartX = 0, touchStartY = 0;
const cardArea = $('cardArea');
cardArea.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });

cardArea.addEventListener('touchend', (e) => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    if (dx > 0) prev();
    else next();
  }
}, { passive: true });

// Keyboard for desktop preview
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') prev();
  else if (e.key === 'ArrowRight') next();
  else if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();
    flip();
  }
});

renderCard();
</script>

    back: `<p><strong>Open source:</strong> <em>"(usually free), can access/change source code, redistribute"</em>; wider customer base; users can fix bugs; limited documentation; little financial gain for creator.</p><p><strong>Proprietary:</strong> <em>"purchase at a cost, cannot access/change code"</em>; allows programmer to earn money; more control over IP; usually well-tested; cannot be adapted to user needs.</p><p><strong>Both</strong> are <strong>copyrighted</strong> – the creator still owns the IP.</p><br><p><strong>Exam evidence:</strong> Jun24/Q4 (8 marks) MS indicative content — these exact phrases. Jun23/Q5d (4+2 marks): proprietary benefit to creator = "earn money via licences, no-one can see code"; open source benefit to user = "view/edit code to tailor/improve/adapt, errors fixed by anyone, freely accessible".</p>`
  },
  {
    type: "8-mark",
    spec: "1.6",
    front: `<strong>Worked Band-3 answer</strong>: Jun22/Q4 — "Social networking websites use AI to monitor user posts. Discuss positive and negative uses including legal, ethical, privacy issues." [8]`,
    back: `<p><strong>Define:</strong> AI scans every user post against rules/training data to flag inappropriate or illegal content automatically.</p><p><strong>[Legal +]</strong> Under <strong>CDPA 1988</strong>, AI can auto-detect plagiarised videos/images. Under <strong>DPA 2018</strong>, rules must be followed so the algorithm does not breach security. Users agreed to T&amp;Cs on signup so should expect it.</p><p><strong>[Ethical +]</strong> Can limit plagiarism; ensures inappropriate/illegal posts are not published; users feel safer because they know harmful content is filtered.</p><p><strong>[Ethical −]</strong> Users may not want everything they post monitored; AI may <strong>incorrectly block</strong> users/posts (bias); records of monitoring may be stored and reused for other means.</p><p><strong>[Privacy −]</strong> Users may feel watched all the time; T&amp;Cs may sign away their rights to privacy; <em>however</em>, some may prefer a computer analysing their posts than people reading them.</p><p><strong>Conclusion:</strong> On balance, AI monitoring is justified <strong>provided</strong> the platform is transparent (DPA-compliant), users consent, and human appeal is allowed for incorrect blocks.</p><br><p><strong>Exam evidence:</strong> Jun22/Q4 (8 marks) — every bullet above is taken directly from the MS indicative content. ER 2022 warned: <em>"primarily negative, positive points limited"</em> — force at least 2 positives.</p>`
  },
  {
    type: "8-mark",
    spec: "1.6",
    front: `<strong>Worked Band-3 answer</strong>: SAMs/Q11 — "Discuss the impact of people wanting to upgrade smartphones, including users, cultural, ethical, environmental." [8]`,
    back: `<p><strong>Define:</strong> Users replace working smartphones with the latest model every 1–2 years for newer features or status.</p><p><strong>[Cultural −]</strong> Desire/need to own the newest device to <strong>fit in with peers</strong>; new features may be required for work/leisure.</p><p><strong>[Environmental −]</strong> <strong>E-waste</strong> – people dispose of working devices in landfill; modern phones <strong>poorly designed for durability</strong>; hardware <strong>not upgradeable/replaceable</strong>; equipment sent abroad (Africa/Asia) for disposal; <strong>toxic waste released into land, ground water, air</strong>; waste of precious metals.</p><p><strong>[Environmental +]</strong> Older devices could be <strong>distributed to people without devices</strong> or <strong>recycled for components</strong>.</p><p><strong>[Ethical −]</strong> Contributes to <strong>digital divide</strong> and social divide; <strong>social pressure on parents</strong> to pay for upgrades; bullying of those who can't afford the latest tech; <strong>manufacturers intentionally design fragile phones</strong> (planned obsolescence); confidential data left on discarded devices.</p><p><strong>Conclusion:</strong> The drive to upgrade is largely harmful – environmentally and ethically – unless tempered by recycling schemes and longer-lasting design.</p><br><p><strong>Exam evidence:</strong> SAMs/Q11 (8 marks) — every bullet from MS indicative content. Band 3 requires balanced AND scenario-applied.</p>`
  },
  {
    type: "Scenario",
    spec: "1.6",
    front: `<strong>Jun23/Q6 stem</strong>: Facial recognition added to shopping-centre CCTV. Name <strong>one privacy positive</strong> and <strong>one privacy negative</strong> (MS phrasing).`,
    back: `<p><strong>Privacy +:</strong> Customers are already in a <strong>public place</strong> and can be legally recorded by anyone anyway.</p><p><strong>Privacy −:</strong> Users may feel it is an <strong>invasion of privacy</strong>; customers have <strong>not given permission</strong> to be tracked through the centre and may not know the system exists.</p><p><strong>DPA link:</strong> facial data is <em>personal data</em> – the centre must keep it secure, only use for the stated purpose, inform customers via signs, and can be <strong>fined</strong> for breaches.</p><br><p><strong>Exam evidence:</strong> Jun23/Q6 (8 marks) MS. ER 2023: candidates lost marks by discussing CCTV generally rather than the <em>upgrade</em> to facial recognition – stick to the new element.</p>`
  },
  {
    type: "Scenario",
    spec: "1.6",
    front: `<strong>Jun25/Q3 stem</strong>: Tablet maker cuts manufacturing cost and stops releasing software updates for older tablets. Give 2 <strong>environmental</strong> and 2 <strong>ethical</strong> impacts (MS phrasing).`,
    back: `<p><strong>Environmental −:</strong> Increase in <strong>e-waste</strong> from products that are disposed of.</p><p><strong>Environmental +:</strong> Older devices could be <strong>distributed to people without devices</strong>, or products <strong>recycled for components</strong>.</p><p><strong>Ethical:</strong> Will cost remain the same? – <strong>unfair on customers</strong>; will customers be told or are they being <strong>deceived</strong>? Ethical for the company (more profit, better staff pay) but <strong>unethical to customers</strong>. Reduced cost may = reduced reputation, long-term loss if customers leave. Lower price may let more people afford a device.</p><p><strong>Recommendation hook:</strong> Cost-cutting is acceptable <strong>only if</strong> customers are informed and devices remain reliable.</p><br><p><strong>Exam evidence:</strong> Jun25/Q3 (8 marks) MS indicative content. Top band requires both positive AND negative for both customer and company.</p>`
  },
  {
    type: "Misconception",
    spec: "1.6",
    front: `<strong>DPA vs CMA</strong> – which law applies?<br>(a) Hacker breaks into a bank to steal data.<br>(b) A company stores customer data insecurely.<br>(c) Secretary reads lawyer's personal email without permission.`,
    back: `<p>(a) <strong>CMA 1990</strong> – unauthorised access with intent to commit a further offence (offence 2). DPA does NOT cover the act of hacking.</p><p>(b) <strong>DPA 2018</strong> – principle 6 (secure). DPA governs how organisations <strong>store/process</strong> personal data.</p><p>(c) <strong>CMA 1990</strong> – unauthorised access to computer material (offence 1). The DPA governs the <strong>company's</strong> data handling; CMA governs the <strong>act of breaking in</strong>.</p><br><p><strong>Exam evidence:</strong> SAMs/Q10d &amp; Jun22/Q5c tick-grids (6 &amp; 5 marks). MS: "Storing customer data insecurely" = DPA; "Installing a keylogger on a colleague's computer" = CMA; "Secretary accessing lawyer's email" = CMA.</p>`
  },
  {
    type: "Concept",
    spec: "1.6",
    front: `<strong>Digital divide</strong> – what is it, and give 2 named causes (cultural angle).`,
    back: `<p>The <strong>digital divide</strong> is the gap between those who have <strong>access to modern digital technology</strong> (devices, fast broadband, skills) and those who do not.</p><p>Causes:</p><p>• <strong>Cost</strong> – poorer families cannot afford a device per child or fast broadband.</p><p>• <strong>Geography</strong> – rural areas lack reliable broadband infrastructure.</p><p>• Age – elderly users excluded from online-only services.</p><p>• Phone upgrade culture creates bullying / FOMO for those without latest tech.</p><br><p><strong>Exam evidence:</strong> SAMs/Q11 MS — <em>"Contributes to the digital divide… social divide… bullying of those who cannot afford the latest technology."</em></p>`
  },
  {
    type: "Concept",
    spec: "1.6",
    front: `What is <strong>planned obsolescence</strong>? Give 2 examples (environmental/ethical angle).`,
    back: `<p><strong>Planned obsolescence</strong> = manufacturers deliberately design products so they need replacing sooner, to boost sales.</p><p>Examples:</p><p>• Phones with <strong>non-replaceable batteries</strong> or <strong>fragile</strong> screens.</p><p>• Hardware that is <strong>not upgradeable/replaceable</strong>.</p><p>• <strong>Stopping software updates</strong> for older devices so they become insecure or unsupported (Jun25/Q3 scenario).</p><p>Consequences: more <strong>e-waste in landfill</strong>, toxic waste released into land/water/air, social pressure to upgrade.</p><br><p><strong>Exam evidence:</strong> SAMs/Q11 MS: <em>"Phone manufacturers intentionally designing fragile phones so they need to be replaced more often."</em> Jun25/Q3 stem: stopping updates so customers must buy new devices.</p>`
  },
  {
    type: "Scenario",
    spec: "1.6",
    front: `A youth centre stores members' names, addresses and medical info. Name <strong>the legislation</strong> and give <strong>3 steps</strong> the centre must take. (4 marks)`,
    back: `<p><strong>Legislation:</strong> <strong>Data Protection Act 2018</strong> (DPA / GDPR).</p><p>Any 3 steps from:</p><p>• <strong>Keep data secure</strong> – encrypt, firewalls, access rights, physical security.</p><p>• Do not <strong>share/sell</strong> data without consent.</p><p>• Only keep <strong>relevant</strong> data; do not collect what is not required.</p><p>• Do not store <strong>longer than needed</strong>; delete when finished.</p><p>• Keep data <strong>accurate/up-to-date</strong>.</p><p>• Only use data for the <strong>purpose collected</strong>.</p><p>• Appoint a <strong>Data Protection Officer</strong>.</p><p>• <strong>Notify individuals</strong> of breaches; train staff in the principles.</p><br><p><strong>Exam evidence:</strong> Jun25/Q4f (4 marks) — MS: 1 mark for naming DPA + 1 mark each (max 3) for steps. ER 2025: candidates lost marks giving generic "keep it safe" rather than concrete actions.</p>`
  },
// --- flashcards_cross_A.js ---
{
    type: "Connection",
    spec: "1.1 + 1.5",
    front: `How does the <strong>operating system</strong> <em>multi-task</em>, and what is the <strong>CPU</strong> actually doing while that happens?`,
    back: `<p>The OS performs <strong>memory management</strong> and <strong>processor (CPU) scheduling</strong>: it gives each running process a tiny <strong>slice of CPU time</strong> so processes <strong>appear to run simultaneously</strong>.</p><p>Underneath, the CPU is running its <strong>Fetch–Decode–Execute cycle</strong> through one process's instructions. After a few thousand cycles, a scheduler <strong>interrupt</strong> swaps the process out: registers are saved, the next process's registers are loaded, and the FDE cycle continues on the new instructions. Repeat thousands of times per second.</p><br><p><strong>Exam evidence:</strong> Jun25/Q2a (1 of 5 marks) — "running multiple programs at the same time" → MS: <em>memory management / processor (CPU) management / multi-tasking</em>. Combine with Jun24/Q6a (FDE: fetched → decoded → executed).</p>`
  },
  {
    type: "Scenario",
    spec: "1.1 + 1.2",
    front: `A car's <strong>'Follow Me'</strong> embedded cruise-control system has <strong>ROM</strong> and <strong>RAM</strong> but <strong>no virtual memory</strong>. <em>Why?</em>`,
    back: `<p>An <strong>embedded system</strong> is a computer built into a larger device to perform a <strong>single dedicated task</strong>. It runs a <strong>small fixed program</strong> with <strong>limited inputs</strong> — so the amount of RAM needed is <strong>small and predictable</strong>.</p><p>The system <strong>does not run multiple applications</strong>, so the RAM will <strong>never become full</strong>. There is therefore <strong>no need for virtual memory</strong> (which would swap data from secondary storage when RAM is full).</p><br><p><strong>Exam evidence:</strong> Jun24/Q7a + Q7b(iii) (3 + 2 marks) — MS for (iii): <em>"the 'Follow Me' system performs limited / few tasks // it does not need to run multiple applications // RAM will not become full / there is enough RAM."</em></p>`
  },
  {
    type: "Trace",
    spec: "1.2 + 1.5",
    front: `<strong>Virtual memory</strong>: trace the path of a piece of data from when it overflows RAM to when it's needed again. Which OS function manages this?`,
    back: `<p>Managed by the OS's <strong>memory management</strong> function.</p><p>1. <strong>RAM becomes full</strong>.<br>2. Data not currently being used is <strong>moved out of RAM</strong> and stored in a section of <strong>secondary storage</strong> called <strong>virtual memory</strong>.<br>3. When that data is needed again, it is <strong>transferred back to RAM</strong>.<br>4. To make space, other unused data is moved from RAM → virtual memory.</p><p><strong>Trap:</strong> the final step is <em>back to RAM</em>, NOT "back to primary storage" (Jun23 ER flagged this as too vague).</p><br><p><strong>Exam evidence:</strong> Jun23/Q5a(iii) (4 marks, true/false on VM); Jun24/Q3a (4 marks) — MS: <em>"Memory management — transfers data between RAM and secondary storage / manages virtual memory."</em></p>`
  },
  {
    type: "Connection",
    spec: "1.3 + 1.5",
    front: `Which <strong>OS function</strong> handles a printer's NIC driver, and how does the printer end up connected to the network?`,
    back: `<p><strong>Peripheral management / device drivers</strong> is the OS function. The OS installs and runs a <strong>device driver</strong> — software that lets the OS communicate with the printer (or NIC, or graphics card).</p><p>On the <strong>network side</strong>, the printer connects (wired or Wi-Fi) to a <strong>switch</strong> which routes data using <strong>MAC addresses</strong>. The OS sends print jobs through the driver, down the network stack, and out via the NIC.</p><br><p><strong>Exam evidence:</strong> Jun25/Q2a (5 marks) — MS row: <em>"Installing the driver for a new printer" → Peripheral management / Device driver management.</em> Pair with Jun24/Q2c(iii) on switch role.</p>`
  },
  {
    type: "Compare",
    spec: "1.1 + 1.2",
    front: `<strong>Why is cache faster than RAM?</strong> Where does the FDE cycle look <em>first</em> for the next instruction?`,
    back: `<p><strong>Cache</strong> is <strong>very fast memory built into / very close to the CPU</strong>. RAM sits further away on the motherboard, so accessing RAM takes longer.</p><p>During the FDE cycle, the CPU checks <strong>cache first</strong>. If the instruction or data is in cache (a <em>cache hit</em>) it is fetched immediately. Only on a <em>cache miss</em> does the CPU fetch from RAM. <strong>Larger cache</strong> = more instructions stored close to the CPU = <strong>fewer trips to RAM</strong> = higher performance.</p><br><p><strong>Exam evidence:</strong> SAMs/Q1c (2 marks) — MS: <em>"Cache stores frequently used data/instructions (1); so the CPU does not need to fetch it from RAM each time / quicker to access (1)."</em></p>`
  },
  {
    type: "Scenario",
    spec: "1.4 + 1.6",
    front: `A hacker <strong>brute-forces a Wi-Fi password</strong> to access a neighbour's network and copy their files. <em>Which CMA 1990 offences apply?</em>`,
    back: `<p>The <strong>Computer Misuse Act 1990</strong> has <strong>three offences</strong>:</p><p>1. <strong>Unauthorised access</strong> to computer material — guessing the Wi-Fi password itself.<br>2. <strong>Unauthorised access with intent to commit a further offence</strong> — accessing in order to copy private files.<br>3. <strong>Unauthorised modification</strong> of computer material — if they then deleted or altered any files.</p><p><strong>Brute force</strong> is a 1.4 network attack: trying every possible password combination, often automated, until the correct one is found. Strong/long passwords and account lockouts defend against it.</p><br><p><strong>Exam evidence:</strong> SAMs/Q10d (6 marks, legislation tick-table) — every "unauthorised access" / "without permission" row maps to CMA 1990. Jun23/Q4 lists brute-force as a threat.</p>`
  },
  {
    type: "Scenario",
    spec: "1.3 + 1.2 + 1.6",
    front: `A law firm moves its files to the <strong>cloud</strong>. What <em>type of network</em> is the cloud, what <em>kind of storage</em> is it, and what <em>legislation</em> still applies to the data?`,
    back: `<p><strong>Network (1.3.1):</strong> the cloud is storage on <strong>remote servers accessed over the internet</strong> — i.e. over a <strong>WAN</strong>. Needs a constant internet connection; reliant on a third party.</p><p><strong>Storage (1.2.2):</strong> the data physically lives on the cloud provider's <strong>secondary storage</strong> (usually large magnetic HDDs or SSDs in a data centre) — not on the law firm's local machines.</p><p><strong>Legislation (1.6):</strong> the firm is <strong>still legally responsible</strong> under the <strong>Data Protection Act 2018</strong> for any personal data, even though a third party stores it.</p><br><p><strong>Exam evidence:</strong> SAMs/Q10b+c (4+4 marks) — MS disadvantages: <em>"still legally responsible if things go wrong (1) // Implications of Data Protection Act (1) // Reliant on third party (1)."</em> Jun25/Q4d and Q4f reinforce.</p>`
  },
  {
    type: "Misconception",
    spec: "1.4 + 1.5",
    front: `<em>"Encryption stops hackers intercepting my data on the network."</em> — what's <strong>wrong</strong>, and which <strong>utility software</strong> actually does this job?`,
    back: `<p><strong>Wrong:</strong> encryption does <strong>not</strong> stop data being intercepted. Data can still be intercepted while travelling across the network.</p><p><strong>Correct (mark-scheme phrasing):</strong> <strong>encryption software</strong> (a 1.5.2 utility) <strong>scrambles data using a key</strong> so that if it <em>is</em> intercepted it is <strong>meaningless / cannot be understood</strong> without the key. The recipient uses a key to <strong>decrypt</strong> back to plaintext.</p><p>This sits across <strong>1.4 (prevents data being read after an interception attack)</strong> and <strong>1.5.2 (encryption utility software)</strong>.</p><br><p><strong>Exam evidence:</strong> Jun25/Q2b(ii) (3 marks) — MS: <em>"scrambles the data (1) using a key (1) so it is meaningless if intercepted (1)."</em> Jun22 ER flags "stops interception" as wrong.</p>`
  },
  {
    type: "Scenario",
    spec: "1.2 + 1.3",
    front: `When TikTok sends a video to your phone, <strong>where does compression happen</strong> and <strong>where does TCP/IP fit in</strong>?`,
    back: `<p><strong>Compression (1.2.5)</strong> happens at the <strong>sending end</strong>: the raw video is reduced in file size (usually <strong>lossy</strong> for video — some quality removed permanently) so it takes <strong>less bandwidth</strong> and <strong>downloads faster</strong>.</p><p><strong>TCP/IP (1.3.2)</strong> then takes over: the compressed file is split into <strong>packets</strong>, each given an <strong>IP address</strong> (destination), routed across the internet, and reassembled at your phone. <strong>Layered protocols</strong> mean compression, transport, and physical transmission are handled independently.</p><br><p><strong>Exam evidence:</strong> Likely 2026 stem: <em>"Explain two benefits of compressing a video file before streaming it." (4 marks)</em> — representative. MS-style: <em>smaller file size / less bandwidth used / faster to send / cheaper data usage.</em> Based on Jun22/Q6d(i).</p>`
  },
  {
    type: "Scenario",
    spec: "1.1 + 1.2 + 1.5",
    front: `A <strong>Sky-Q-style set-top box</strong> records TV. Identify: <em>(a) the embedded system feature, (b) why it uses a magnetic HDD, (c) one utility it would run.</em>`,
    back: `<p><strong>(a) Embedded (1.1.3):</strong> the set-top box is a <strong>computer built into a larger device</strong> to perform a <strong>dedicated function</strong> (record/play TV). It boots from <strong>ROM</strong> with fixed firmware.</p><p><strong>(b) Magnetic HDD (1.2.2):</strong> chosen for <strong>high capacity per £</strong> — needed because video files are huge. The box is stationary so the fragility of a magnetic drive doesn't matter.</p><p><strong>(c) Utility (1.5.2):</strong> a <strong>defragmentation utility</strong> rearranges fragmented recordings into <strong>contiguous blocks</strong>, reducing read-head movement and giving <strong>faster playback / fewer disc accesses</strong>. Defrag is HDD-only — not used on SSDs.</p><br><p><strong>Exam evidence:</strong> SAMs/Q9a+b (4+3 marks, defrag); Jun24/Q5b(i) (magnetic vs SSD justification); Jun24/Q7a (embedded). Representative composite stem for 2026.</p>`
  },
  {
    type: "Compare",
    spec: "1.3 + 1.4",
    front: `A hospital network is hit by both a <strong>DoS attack</strong> and an <strong>SQL injection</strong>. For each, name (a) what part of the network is targeted and (b) one prevention method.`,
    back: `<p><strong>DoS / DDoS (1.4):</strong> floods a <strong>server / web server</strong> with so many requests it <strong>cannot respond to legitimate users</strong>. Prevention: <strong>firewall</strong> filters/blocks unauthorised traffic; rate-limiting at the router.</p><p><strong>SQL injection (1.4):</strong> targets the <strong>database server</strong> behind a website — malicious SQL is typed into an input box to read/alter data. Prevention: <strong>input validation</strong> / sanitising form inputs / parameterised queries.</p><p>Both rely on 1.3 infrastructure (servers, packets, ports) — and both are CMA 1990 §1 offences (unauthorised access) under 1.6.</p><br><p><strong>Exam evidence:</strong> SAMs/Q8a (6 marks, three ways hospital protects network); Jun23/Q4a (4-mark tick-table matching prevention methods to threats). MS for firewall: <em>"scans incoming/outgoing traffic; blocks unauthorised traffic."</em></p>`
  },
  {
    type: "Connection",
    spec: "1.1 + 1.3",
    front: `<strong>More CPU cores</strong> won't help a slow Wi-Fi connection. <em>Why not?</em> What actually limits network performance?`,
    back: `<p><strong>CPU performance (1.1.2)</strong> depends on <strong>clock speed</strong>, <strong>number of cores</strong>, and <strong>cache size</strong> — these speed up <em>local</em> processing.</p><p><strong>Network performance (1.3.1)</strong> is limited by:<br>• <strong>Bandwidth</strong> available to share<br>• <strong>Number of users/devices</strong> contending for that bandwidth<br>• Wired vs wireless (interference, range)<br>• <strong>Type of transmission media</strong> (copper, fibre)</p><p>Adding cores doesn't make the Wi-Fi link wider. The bottleneck is the <strong>shared bandwidth</strong>, not the CPU.</p><br><p><strong>Exam evidence:</strong> Jun22/Q3a(i) (3 marks) — MS: <em>"bandwidth has to be split between devices (1); collisions/contention increase (1); less bandwidth per device → slower transmission (1)."</em> Pair with Jun24/Q6c (CPU performance characteristics).</p>`
  },

{
    type: "8-mark",
    spec: "cross",
    front: `<strong>How do I spot the 8-mark Q?</strong><br>What clues in the stem tell me it's the starred extended-response?`,
    back: `<strong>Command words:</strong> "<em>discuss</em>", "<em>evaluate</em>", "<em>analyse the impact of</em>", "make a recommendation".<br>
<strong>Stem length:</strong> 4-8 lines, always a real-world scenario.<br>
<strong>Topic:</strong> 100% of past 8-markers are <strong>1.6 (Ethical / Legal / Cultural / Environmental / Privacy)</strong> — often touching 1.4 (security) or 1.3 (networks).<br>

    front: `<strong>Folder management</strong> — accepted on the MS? And <strong>POP vs IMAP</strong>?`,
    back: `<p><strong>Folder management — NO.</strong> MS uses <strong>file management</strong> (creating, naming, moving, deleting, opening files). "Folder management" alone is rejected; write <em>"file/folder management"</em> to be safe.</p><p><strong>POP vs IMAP:</strong></p><p>• <strong>POP</strong> = <strong>downloads</strong> email to device and (usually) <strong>deletes</strong> from the server.<br>• <strong>IMAP</strong> = <strong>keeps mail on the server</strong>, syncs across multiple devices.<br>• <strong>SMTP</strong> = <strong>sending</strong> email (outbox).</p><br><p><strong>Exam evidence:</strong> Jun24/Q3a (4 marks) — OS function table includes <em>"file management"</em>. Jun23/Q2a(i) (4 marks) — protocols table: POP/IMAP for receiving, SMTP for sending. Jun23/ER flags candidates writing SMTP for inbox check.</p>`
  },
  {
    type: "Calc",
    spec: "cross",
    front: `<strong>Image file size</strong> — formula and unit chain.`,
    back: `<p><strong>File size (bits) = width × height × colour depth</strong> (colour depth in bits).</p><p>Unit chain: <strong>bits → bytes → KB → MB</strong> by dividing by 8, then 1000, then 1000.</p><p>Worked example (Jun25/Q1b(ii)): 10 images, 800 × 500 pixels, 8-bit colour depth.<br>= 10 × 800 × 500 × 8 = 32,000,000 bits<br>÷ 8 = 4,000,000 bytes<br>÷ 1000 = <strong>4000 KB</strong>.</p><p><strong>Always show working</strong> — Jun22/23/24 ERs all penalise missing working.</p><br><p><strong>Exam evidence:</strong> Jun25/Q1b(ii) (2 marks) — MS: 1 mark working, 1 mark answer 4000 KB.</p>`
  },
  {
    type: "Calc",
    spec: "cross",
    front: `<strong>Sound file size</strong> — formula and unit chain.`,
    back: `<p><strong>File size (bits) = sample rate (Hz) × bit depth × duration (s)</strong>.</p><p>Unit chain: <strong>bits → bytes → KB → MB</strong> (÷ 8, then ÷ 1000, ÷ 1000).</p><p>Also memorise the <strong>effects</strong>:</p><p>• Higher <strong>sample rate</strong> → more accurate sound / closer to original → larger file.<br>• Higher <strong>bit depth</strong> → more unique amplitude values → better quality → larger file.<br>• Longer <strong>duration</strong> → larger file (linear).</p><br><p><strong>Exam evidence:</strong> Jun22/Q6a(ii) (3 marks) tick-table; Jun24/Q5a(ii) (2 marks) — <em>"explain the effect of changing bit depth"</em>: MS accepts <em>"more unique amplitude values can be stored / sound is more accurate / file size increases"</em>.</p>`
  },
  {
    type: "Calc",
    spec: "cross",
    front: `<strong>Binary addition</strong> — carry rules and overflow.`,
    back: `<p>Column-by-column, right-to-left:</p><p>• 0 + 0 = <strong>0</strong><br>• 0 + 1 = <strong>1</strong><br>• 1 + 1 = <strong>10</strong> (write 0, carry 1)<br>• 1 + 1 + 1 = <strong>11</strong> (write 1, carry 1)</p><p>Always <strong>show your carries</strong> above the sum line (this is the working mark). Answer must stay <strong>8 bits</strong>; if a 9th bit is produced, that's <strong>overflow</strong> — state it.</p><p><strong>Binary shift:</strong> left shift by n = <strong>× 2ⁿ</strong>; right shift by n = <strong>÷ 2ⁿ</strong>. Bits that fall off the end are <strong>lost (loss of precision)</strong>. No binary point.</p><br><p><strong>Exam evidence:</strong> Jun23/Q1e, Jun24/Q1e, Jun25/Q5c — all 2-mark binary additions (1 mark working, 1 mark answer). Jun24/Q1c — 4-place left shift on 00001111 → 11110000.</p>`
  },
  {
    type: "Connection",
    spec: "cross",
    front: `Past-paper Q: <em>"Explain how more devices affect network performance."</em> (3 marks) — what is the examiner ACTUALLY asking?`,
    back: `<p>The examiner wants a <strong>chain of reasoning</strong>, NOT just "the network is slower".</p><p>MS-shape answer:</p><p>• More devices means <strong>bandwidth is shared</strong> between more users <em>so</em> each device gets less.<br>• More devices means <strong>more data packets / collisions / contention</strong> for the same medium <em>therefore</em> latency increases.<br>• Network may become <strong>congested</strong>, causing <strong>slower transmission speeds / dropped packets</strong>.</p><p>Jun22 ER explicitly warns: <em>"answers were too vague — 'runs slower' on its own does not earn marks"</em>.</p><br><p><strong>Exam evidence:</strong> Jun22/Q3a(i) (3 marks). MS requires linked points: cause → mechanism → effect. Skeleton: <strong>bandwidth / collisions / congestion</strong>.</p>`
  },
  {
    type: "Connection",
    spec: "cross",
    front: `Past-paper Q: <em>"What is the 8-mark Q on?"</em> — predict the topic and structure.`,
    back: `<p><strong>Topic:</strong> Almost always <strong>1.6</strong> — ethical / legal / cultural / environmental impact of a technology scenario. <strong>100% of past 8-markers</strong> (SAMs, Jun22, Jun23, Jun24, Jun25) have been 1.6.</p><p><strong>Structure to hit MB3 (6–8):</strong></p><p>• <strong>Both sides</strong> — positive AND negative (one-sided caps at MB2).<br>• <strong>Apply to the scenario</strong> — generic "AI is bad" loses marks.<br>• <strong>Name an Act</strong> — DPA 2018 / CMA 1990 / CDPA 1988.<br>• <strong>Recommendation / conclusion</strong> at the end (especially if "make a recommendation" is asked).<br>• <strong>Use headers or bullets</strong> — ER praises this structure.</p><br><p><strong>Exam evidence:</strong> SAMs/Q11*, Jun22/Q4*, Jun23/Q6*, Jun24/Q4*, Jun25/Q3* — all 8 marks, all topic 1.6, all "Discuss" command word.</p>`
  }
];

let currentFilter = 'ALL';
let order = [];
let currentIndex = 0;

const $ = id => document.getElementById(id);
const cardEl = $('card');
const emptyEl = $('empty');

function matchesFilter(card, f) {
  if (f === 'ALL') return true;
  if (f === 'cross') return card.spec.indexOf('+') !== -1 || card.spec === 'cross';
  // f is '1.1', '1.2', etc.
  // Match only single-topic specs, not cross (no '+'), starting with f.
  if (card.spec.indexOf('+') !== -1) return false;
  if (card.spec === 'cross') return false;
  // Either exact match (e.g. '1.4', '1.6') or starts with 'f.' (e.g. '1.1.1')
  return card.spec === f || card.spec.indexOf(f + '.') === 0;
}

function buildOrder() {
  order = [];
  for (let i = 0; i < cards.length; i++) {
    if (matchesFilter(cards[i], currentFilter)) order.push(i);
  }
}

function renderCard() {
  if (order.length === 0) {
    cardEl.style.display = 'none';
    emptyEl.classList.add('visible');
    $('counter').textContent = '0 / 0';
    $('prev').disabled = true;
    $('next').disabled = true;
    return;
  }

  cardEl.style.display = '';
  emptyEl.classList.remove('visible');

  if (currentIndex >= order.length) currentIndex = 0;
  if (currentIndex < 0) currentIndex = order.length - 1;

  const card = cards[order[currentIndex]];
  cardEl.classList.remove('flipped');

  $('typeBadge').textContent = card.type.toUpperCase();
  $('typeBadgeBack').textContent = card.type.toUpperCase();
  $('specBadge').textContent = card.spec;
  $('specBadgeBack').textContent = card.spec;

  $('questionText').innerHTML = card.front;
  $('answerText').innerHTML = card.back;

  $('counter').textContent = (currentIndex + 1) + ' / ' + order.length;

  $('prev').disabled = false;
  $('next').disabled = false;

  // Reset scroll on both faces
  document.querySelectorAll('.face').forEach(f => f.scrollTop = 0);
}

function flip() {
  if (order.length === 0) return;
  cardEl.classList.toggle('flipped');
}

function next() {
  if (order.length === 0) return;
  currentIndex = (currentIndex + 1) % order.length;
  renderCard();
}

function prev() {
  if (order.length === 0) return;
  currentIndex = (currentIndex - 1 + order.length) % order.length;
  renderCard();
}

function shuffle() {
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = order[i]; order[i] = order[j]; order[j] = tmp;
  }
  currentIndex = 0;
  renderCard();
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.filter === f);
  });
  buildOrder();
  currentIndex = 0;
  renderCard();
}

// Tap to flip (only on the card itself)
cardEl.addEventListener('click', flip);

$('next').addEventListener('click', (e) => { e.stopPropagation(); next(); });
$('prev').addEventListener('click', (e) => { e.stopPropagation(); prev(); });
$('shuffle').addEventListener('click', (e) => { e.stopPropagation(); shuffle(); });

document.querySelectorAll('.filter').forEach(btn => {
  btn.addEventListener('click', () => setFilter(btn.dataset.filter));
});

$('resetFilter').addEventListener('click', () => setFilter('ALL'));

// Swipe gestures
let touchStartX = 0, touchStartY = 0, touchStartT = 0;
const cardArea = $('cardArea');
cardArea.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  touchStartT = Date.now();
}, { passive: true });

cardArea.addEventListener('touchend', (e) => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  const dt = Date.now() - touchStartT;
  if (dt < 600 && Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    if (dx > 0) prev();
    else next();
  }
}, { passive: true });

// Keyboard support
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') prev();
  else if (e.key === 'ArrowRight') next();
  else if (e.key === ' ' || e.key === 'f' || e.key === 'F') {
    e.preventDefault();
    flip();
  } else if (e.key === 's' || e.key === 'S') {
    shuffle();
  }
});

// Init
buildOrder();
renderCard();
</script>
